name: build
on: [push, workflow_dispatch]
jobs:
  b:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: |
          export THEOS=$RUNNER_TEMP/theos
          git clone --depth 1 https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          echo "$THEOS/bin" >> $GITHUB_PATH
          brew install ldid || true
      - run: |
          cd MotionBlurXL
          make package FINALPACKAGE=1
      - uses: actions/upload-artifact@v4
        with:
          name: dylib
          path: |
            MotionBlurXL/.theos/obj/**/*.dylib
            MotionBlurXL/packages/*.deb
